version: '3.8'

services:
  # ─── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: unb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: unb_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unb_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - unb-network

  # ─── Express Backend API ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unb-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/unb_db?schema=public
      JWT_SECRET: unb-secure-jwt-secret-key-32-characters-minimum-length
      JWT_EXPIRES_IN: 8h
      FRONTEND_URL: http://localhost:5173
      EMAIL_PROVIDER: mock
      CAPTCHA_PROVIDER: mock
      STORAGE_PROVIDER: local-private
    ports:
      - "5000:5000"
    volumes:
      - unb_uploads:/app/uploads
      - unb_private_storage:/app/storage/private
    depends_on:
      db:
        condition: service_healthy
    networks:
      - unb-network

  # ─── React + Vite Frontend (Nginx SPA) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unb-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "3000:80"
    depends_on:
      - backend
    networks:
      - unb-network

# ─── Persistent Volumes ───────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  unb_uploads:
    driver: local
  unb_private_storage:
    driver: local

# ─── Bridge Network ───────────────────────────────────────────────────────────
networks:
  unb-network:
    driver: bridge
